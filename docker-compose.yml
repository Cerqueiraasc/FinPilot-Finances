services:
  postgres:
    image: postgres:17-alpine
    container_name: finpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot
      POSTGRES_DB: finpilot
    ports:
      - "5432:5432"
    volumes:
      - finpilot-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot -d finpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  finpilot-pgdata:
